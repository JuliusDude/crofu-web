name: Weekly ML Predictor

on:
  schedule:
    # Runs at 02:00 UTC every Sunday (which is 7:30 AM IST on Sunday)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  train-and-predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r workers/requirements.txt
        
      - name: Run ML Predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python workers/weekly_predictor.py
        
      - name: Commit and Push Retrained Models and CSV Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add workers/logs/*.csv workers/models/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weekly retrained model weights and CSV logs [skip ci]" && git push)
